<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']}}}};
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};

applyTheme();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>

<body class="bg-stone-50 text-stone-900 dark:bg-zinc-950 dark:text-stone-100 antialiased font-sans">
<div id="root"></div>
<script>
const {useState,useEffect,useCallback}=React;
const html=htm.bind(React.createElement);
const sb=supabase.createClient('https://wgxyvmszpnoqniqzisvo.supabase.co','sb_publishable_9AvOFbOZ_6gm6s6XFtCjOA_Aqgo8YiA');

const rp=n=>(n<0?'-':'')+'Rp '+Math.abs(n).toLocaleString('id-ID');
const num=s=>Number(String(s).replace(/\D/g,''))||0;
const fmtIn=s=>{const d=String(s).replace(/\D/g,'').slice(0,13);return d?Number(d).toLocaleString('id-ID'):''};
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const dlabel=s=>{const[y,m,d]=s.split('-');return new Date(y,m-1,d).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short',year:'numeric'})};
const TYPES={bank:'Bank',ewallet:'Dompet digital',cash:'Tunai',other:'Lainnya'};
const LBL={type:'Jenis',amount:'Nominal',fee:'Biaya admin',occurred_on:'Tanggal',note:'Catatan',deleted_at:'Dihapus',account_id:'Akun',to_account_id:'Tujuan',category_id:'Kategori'};
const ACT={create:'Dibuat',update:'Diubah',delete:'Dihapus',restore:'Dipulihkan'};

const card='rounded-2xl bg-white dark:bg-zinc-900 border border-stone-200/70 dark:border-zinc-800';
const inp='mt-1 w-full rounded-xl border border-stone-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 px-3 py-2.5 text-base outline-none focus:ring-2 focus:ring-emerald-700';
const btn='rounded-xl px-4 py-2.5 font-semibold disabled:opacity-50';
const pri=btn+' bg-emerald-800 text-white w-full';
const sec=btn+' bg-stone-200/70 dark:bg-zinc-800';

const Field=({label,children})=>html`<label className="block"><span className="text-xs text-stone-500 dark:text-zinc-400">${label}</span>${children}</label>`;
const Sheet=({title,onClose,children})=>html`<div className="fixed inset-0 z-40 flex items-end justify-center bg-black/40" onClick=${onClose}>
  <div className="w-full max-w-md max-h-[92vh] overflow-y-auto rounded-t-3xl bg-stone-50 dark:bg-zinc-900 p-5 space-y-4" style=${{paddingBottom:'calc(2rem + env(safe-area-inset-bottom))'}} onClick=${e=>e.stopPropagation()}>
    <div className="flex items-center justify-between"><h2 className="text-lg font-bold">${title}</h2><button onClick=${onClose} className="px-2 text-stone-500" aria-label="Tutup">✕</button></div>${children}</div></div>`;

function Login(){
  const[e,setE]=useState(''),[p,setP]=useState(''),[err,setErr]=useState(''),[b,setB]=useState(false);
  const go=async()=>{setB(true);setErr('');const{error}=await sb.auth.signInWithPassword({email:e.trim(),password:p});if(error)setErr('Email atau kata sandi salah.');setB(false)};
  return html`<form className="min-h-screen flex items-center justify-center p-6" onSubmit=${ev=>{ev.preventDefault();go()}}>
    <div className="w-full max-w-sm space-y-4">
      <div><h1 className="text-2xl font-bold">Personal Finance Tracker</h1><p className="text-sm text-stone-500">Masuk untuk melihat keuangan Anda.</p></div>
      <${Field} label="Email"><input type="email" autoComplete="username" className=${inp} value=${e} onChange=${x=>setE(x.target.value)}/><//>
      <${Field} label="Kata sandi"><input type="password" autoComplete="current-password" className=${inp} value=${p} onChange=${x=>setP(x.target.value)}/><//>
      ${err&&html`<p className="text-sm text-red-600">${err}</p>`}
      <button type="submit" className=${pri} disabled=${b||!e||!p}>${b?'Masuk…':'Masuk'}</button>
    </div></form>`;
}

function AccForm({a,run,flash}){
  const[n,setN]=useState(a?.name||''),[t,setT]=useState(a?.type||'bank'),[o,setO]=useState(a?String(a.opening_balance):''),[b,setB]=useState(false);
  const save=async()=>{if(!n.trim())return flash('Nama akun wajib diisi');setB(true);
    const row={name:n.trim(),type:t,opening_balance:num(o)};
    await run(a?sb.from('accounts').update(row).eq('id',a.id):sb.from('accounts').insert(row),'Akun disimpan');setB(false)};
  const arch=()=>{if(!a.is_archived&&a.balance!==0&&!confirm('Saldo '+rp(a.balance)+' tidak akan dihitung di total aset. Arsipkan?'))return;
    run(sb.from('accounts').update({is_archived:!a.is_archived}).eq('id',a.id),a.is_archived?'Akun diaktifkan':'Akun diarsipkan')};
  const del=()=>{if(confirm('Hapus permanen akun ini? Hanya bisa jika belum punya transaksi.'))run(sb.from('accounts').delete().eq('id',a.id),'Akun dihapus')};
  return html`<div className="space-y-4">
    <${Field} label="Nama akun"><input className=${inp} value=${n} placeholder="mis. Bank Jago" onChange=${x=>setN(x.target.value)}/><//>
    <${Field} label="Jenis"><select className=${inp} value=${t} onChange=${x=>setT(x.target.value)}>${Object.entries(TYPES).map(([k,v])=>html`<option key=${k} value=${k}>${v}</option>`)}</select><//>
    <${Field} label="Saldo awal (Rp)"><input inputMode="numeric" className=${inp} value=${fmtIn(o)} onChange=${x=>setO(x.target.value)}/><//>
    ${a&&html`<p className="text-xs text-stone-500">Mengubah saldo awal ikut mengubah saldo saat ini. Untuk mencocokkan dengan saldo nyata, gunakan Sesuaikan saldo.</p>`}
    <button className=${pri} disabled=${b} onClick=${save}>Simpan akun</button>
    ${a&&html`<div className="flex gap-2"><button className=${sec+' flex-1'} onClick=${arch}>${a.is_archived?'Aktifkan kembali':'Arsipkan'}</button><button className=${sec+' flex-1 text-red-600'} onClick=${del}>Hapus</button></div>`}
  </div>`;
}

function Adj({a,run}){
  const[v,setV]=useState(''),[b,setB]=useState(false);
  const diff=v===''?null:num(v)-a.balance;
  return html`<div className="space-y-4">
    <p className="text-sm text-stone-500">Saldo di aplikasi: <b className="text-stone-900 dark:text-stone-100">${rp(a.balance)}</b>. Isi saldo sebenarnya (mis. dari m-banking). Selisihnya dicatat sebagai penyesuaian, bukan pemasukan atau pengeluaran.</p>
    <${Field} label="Saldo sebenarnya (Rp)"><input inputMode="numeric" className=${inp+' text-2xl font-semibold'} value=${fmtIn(v)} onChange=${x=>setV(x.target.value)}/><//>
    ${diff!==null&&html`<p className="text-sm">${diff===0?'Sudah sesuai, tidak ada perubahan.':'Selisih: '+(diff>0?'+':'')+rp(diff)}</p>`}
    <button className=${pri} disabled=${b||diff===null||diff===0} onClick=${async()=>{setB(true);await run(sb.rpc('adjust_account_balance',{p_account_id:a.id,p_actual_balance:num(v),p_date:today(),p_note:'Penyesuaian saldo'}),'Saldo disesuaikan');setB(false)}}>Simpan penyesuaian</button>
  </div>`;
}

function TxForm({t,acc,cats,names,run,flash}){
  const adj=t?.type==='adjustment';
  const[ty,setTy]=useState(t?.type||'expense'),[am,setAm]=useState(t?String(Math.abs(t.amount)):''),
    [a1,setA1]=useState(t?.account_id||acc[0]?.id||''),[a2,setA2]=useState(t?.to_account_id||''),
    [fee,setFee]=useState(t?.fee?String(t.fee):''),[c,setC]=useState(t?.category_id||''),
    [d,setD]=useState(t?.occurred_on||today()),[nt,setNt]=useState(t?.note||''),[b,setB]=useState(false),[h,setH]=useState(null);
  const save=async()=>{
    let row;
    if(adj)row={occurred_on:d,note:nt||null};
    else{
      const a=num(am);
      if(!a)return flash('Nominal harus lebih dari 0');
      if(!a1)return flash('Pilih akun');
      if(ty==='transfer'){if(!a2||a2===a1)return flash('Pilih akun tujuan yang berbeda dari akun asal')}
      else if(!c)return flash('Pilih kategori');
      row={type:ty,amount:a,account_id:a1,to_account_id:ty==='transfer'?a2:null,category_id:ty==='transfer'?null:c,fee:ty==='transfer'?num(fee):0,occurred_on:d,note:nt||null};
    }
    setB(true);
    await run(t?sb.from('transactions').update(row).eq('id',t.id):sb.from('transactions').insert(row),t?'Transaksi diperbarui':'Transaksi disimpan');
    setB(false)};
  const del=()=>{if(confirm('Hapus transaksi ini? Saldo akun akan diperbarui, dan jejaknya tetap ada di riwayat.'))run(sb.from('transactions').update({deleted_at:new Date().toISOString()}).eq('id',t.id),'Transaksi dihapus')};
  const hist=async()=>{if(h){setH(null);return}
    const{data,error}=await sb.from('transaction_history').select('*').eq('transaction_id',t.id).order('changed_at',{ascending:false});
    if(error)return flash(error.message);setH(data)};
  const fv=(k,v)=>v==null?'-':(k==='amount'||k==='fee')?rp(v):k==='deleted_at'?'ya':names[v]||String(v);
  const diff=r=>{if(r.action==='create')return[];const o=r.old_data||{},n=r.new_data||{};
    return Object.keys(n).filter(k=>LBL[k]&&JSON.stringify(o[k])!==JSON.stringify(n[k])).map(k=>LBL[k]+': '+fv(k,o[k])+' → '+fv(k,n[k]))};
  const sel=(v,f,list)=>html`<select className=${inp} value=${v} onChange=${x=>f(x.target.value)}>${list.map(x=>html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select>`;
  return html`<div className="space-y-4">
    ${adj?html`<p className="text-sm text-stone-500">Penyesuaian saldo sebesar <b>${rp(t.amount)}</b>. Nominalnya tidak bisa diubah. Hapus lalu lakukan penyesuaian ulang jika keliru.</p>`:html`<div className="space-y-4">
      <div className="grid grid-cols-3 gap-1 rounded-xl bg-stone-200/70 dark:bg-zinc-800 p-1">${[['expense','Keluar'],['income','Masuk'],['transfer','Transfer']].map(([k,l])=>html`<button key=${k} onClick=${()=>{setTy(k);setC('')}} className=${'rounded-lg py-2 text-sm font-semibold '+(ty===k?'bg-white dark:bg-zinc-950 shadow-sm':'text-stone-500')}>${l}</button>`)}</div>
      <${Field} label="Nominal (Rp)"><input inputMode="numeric" autoFocus=${!t} className=${inp+' text-3xl font-bold'} value=${fmtIn(am)} placeholder="0" onChange=${x=>setAm(x.target.value)}/><//>
      ${ty==='transfer'?html`<div className="space-y-4"><${Field} label="Dari akun">${sel(a1,setA1,acc)}<//>
        <${Field} label="Ke akun"><select className=${inp} value=${a2} onChange=${x=>setA2(x.target.value)}><option value="">Pilih akun tujuan</option>${acc.filter(x=>x.id!==a1).map(x=>html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select><//>
        <${Field} label="Biaya admin (Rp, opsional)"><input inputMode="numeric" className=${inp} value=${fmtIn(fee)} onChange=${x=>setFee(x.target.value)}/><//></div>`
      :html`<div className="space-y-4"><${Field} label="Akun">${sel(a1,setA1,acc)}<//>
        <div><span className="text-xs text-stone-500 dark:text-zinc-400">Kategori</span><div className="mt-1 flex flex-wrap gap-2">${cats.filter(x=>x.kind===ty&&(!x.is_archived||x.id===c)).map(x=>html`<button key=${x.id} onClick=${()=>setC(x.id)} className=${'rounded-full border px-3 py-1.5 text-sm '+(c===x.id?'bg-emerald-800 border-emerald-800 text-white':'border-stone-300 dark:border-zinc-700')}>${x.name}</button>`)}</div></div></div>`}
    </div>`}
    <${Field} label="Tanggal"><input type="date" className=${inp} value=${d} onChange=${x=>setD(x.target.value)}/><//>
    <${Field} label="Catatan (opsional)"><input className=${inp} value=${nt} onChange=${x=>setNt(x.target.value)}/><//>
    <button className=${pri} disabled=${b} onClick=${save}>${t?'Simpan perubahan':'Simpan transaksi'}</button>
    ${t&&html`<div className="flex gap-2"><button className=${sec+' flex-1'} onClick=${hist}>${h?'Tutup riwayat':'Riwayat perubahan'}</button><button className=${sec+' flex-1 text-red-600'} onClick=${del}>Hapus</button></div>`}
    ${h&&html`<ul className="space-y-2 text-sm">${h.map(r=>html`<li key=${r.id} className=${card+' p-3'}><div className="font-semibold">${ACT[r.action]} <span className="font-normal text-stone-500">· ${new Date(r.changed_at).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}</span></div>${diff(r).map(x=>html`<div key=${x} className="text-stone-600 dark:text-zinc-400">${x}</div>`)}</li>`)}</ul>`}
  </div>`;
}

const PAL=['#0f6b4f','#c2410c','#0369a1','#a16207','#7c3aed','#be185d','#475569','#15803d'];
function Donut({items,sum}){
  const r=40,C=2*Math.PI*r;let off=0;
  return html`<svg viewBox="0 0 100 100" className="h-32 w-32 shrink-0 -rotate-90">${items.map((x,i)=>{const len=x.v/sum*C;
    const el=html`<circle key=${x.id} cx="50" cy="50" r=${r} fill="none" stroke=${PAL[i%PAL.length]} strokeWidth="14" strokeDasharray=${len+' '+(C-len)} strokeDashoffset=${-off}/>`;off+=len;return el})}</svg>`;
}
function Line({pts}){
  const lo=Math.min(...pts),hi=Math.max(...pts),rg=hi-lo||1;
  const d=pts.map((v,i)=>(i/(pts.length-1)*300)+','+(90-(v-lo)/rg*80)).join(' ');
  return html`<svg viewBox="0 0 300 100" preserveAspectRatio="none" className="w-full h-28 text-emerald-700 dark:text-emerald-400"><polygon points=${'0,100 '+d+' 300,100'} fill="currentColor" opacity="0.1"/><polyline points=${d} fill="none" stroke="currentColor" strokeWidth="2" vectorEffect="non-scaling-stroke"/></svg>`;
}

function Bars({b}){
  const hi=Math.max(1,...b.flatMap(x=>[x.inc,x.exp])),w=300/b.length;
  return html`<svg viewBox="0 0 300 100" className="w-full h-28">${b.map((x,i)=>html`<g key=${i}><rect x=${i*w+w*0.1} width=${w*0.38} y=${100-x.inc/hi*95} height=${x.inc/hi*95} fill="#0f6b4f"/><rect x=${i*w+w*0.5} width=${w*0.38} y=${100-x.exp/hi*95} height=${x.exp/hi*95} fill="#c2410c"/></g>`)}</svg>`;
}
const WD=['Sen','Sel','Rab','Kam','Jum','Sab','Min'],MN='JFMAMJJASOND'.split('');

const dl=(name,blob)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1e4)};
const TL={income:'Pemasukan',expense:'Pengeluaran',transfer:'Transfer',adjustment:'Penyesuaian'};
const TM={pemasukan:'income',masuk:'income',income:'income',pengeluaran:'expense',keluar:'expense',expense:'expense',transfer:'transfer',penyesuaian:'adjustment',adjustment:'adjustment'};
const pdate=v=>{v=String(v||'').trim();let y,m,d,x;
  if(x=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)){y=x[1];m=x[2];d=x[3]}
  else if(x=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/)){d=x[1];m=x[2];y=x[3]}
  else return null;
  const t=new Date(+y,m-1,+d);
  return t.getFullYear()==y&&t.getMonth()==m-1&&t.getDate()==d?y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'):null};
const pamt=v=>{let t=String(v??'').replace(/rp/i,'').replace(/\s/g,'').replace(/,\d{1,2}$/,'');const neg=t.startsWith('-');t=t.replace(/\D/g,'');return t?(neg?-1:1)*Number(t):0};
const fetchAll=async(tbl,f)=>{let o=[],i=0;for(;;){let q=sb.from(tbl).select('*');if(f)q=f(q);const{data,error}=await q.order('id').range(i,i+999);if(error)throw error;o=o.concat(data);if(data.length<1000)break;i+=1000}return o};

const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function Lock({onOk,onForgot}){
  const[p,setP]=useState(''),[err,setErr]=useState(''),[fail,setFail]=useState(0),[until,setUntil]=useState(0);
  const press=async d=>{if(Date.now()<until)return;const v=(p+d).slice(0,6);setP(v);setErr('');
    if(v.length<6)return;
    const[salt,h]=(LS.get('pft_pin')||':').split(':');
    if(await sha(salt+v)===h)return onOk();
    const f=fail+1;setP('');setFail(f);
    if(f>=5){setUntil(Date.now()+30000);setFail(0);setErr('Terlalu banyak percobaan. Tunggu 30 detik.')}else setErr('PIN salah')};
  return html`<div className="min-h-screen flex items-center justify-center p-6"><div className="w-full max-w-xs text-center space-y-6">
    <div><h1 className="text-xl font-bold">Masukkan PIN</h1><p className="h-5 text-sm text-red-600">${err}</p></div>
    <div className="flex justify-center gap-3">${[0,1,2,3,4,5].map(i=>html`<span key=${i} className=${'h-3 w-3 rounded-full '+(i<p.length?'bg-emerald-800':'bg-stone-300 dark:bg-zinc-700')}></span>`)}</div>
    <div className="grid grid-cols-3 gap-3">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map((k,i)=>k===''?html`<span key=${i}></span>`:html`<button key=${i} onClick=${()=>k==='⌫'?setP(p.slice(0,-1)):press(k)} className=${card+' py-4 text-xl font-semibold'}>${k}</button>`)}</div>
    <button className="text-sm text-stone-500 underline" onClick=${onForgot}>Lupa PIN? Keluar dan masuk lagi</button></div></div>`;
}
function Settings({flash}){
  const[t,setT]=useState(LS.get('pft_theme')||'system'),[pin,setPin]=useState(!!LS.get('pft_pin')),[p1,setP1]=useState(''),[p2,setP2]=useState(''),[pw,setPw]=useState('');
  const theme=k=>{setT(k);LS.set('pft_theme',k);applyTheme()};
  const savePin=async()=>{if(!/^\d{6}$/.test(p1))return flash('PIN harus 6 angka');if(p1!==p2)return flash('Konfirmasi PIN tidak sama');
    const salt=crypto.randomUUID();LS.set('pft_pin',salt+':'+await sha(salt+p1));setPin(true);setP1('');setP2('');flash('PIN diaktifkan')};
  const chg=async()=>{if(pw.length<12)return flash('Kata sandi minimal 12 karakter');const{error}=await sb.auth.updateUser({password:pw});flash(error?error.message:'Kata sandi diganti');if(!error)setPw('')};
  return html`<div className="space-y-6">
    <section className="space-y-2"><h3 className="font-semibold">Tema</h3><div className="grid grid-cols-3 gap-1 rounded-xl bg-stone-200/70 dark:bg-zinc-800 p-1">${[['system','Sistem'],['light','Terang'],['dark','Gelap']].map(([k,l])=>html`<button key=${k} onClick=${()=>theme(k)} className=${'rounded-lg py-2 text-sm font-semibold '+(t===k?'bg-white dark:bg-zinc-950 shadow-sm':'text-stone-500')}>${l}</button>`)}</div></section>
    <section className="space-y-3"><h3 className="font-semibold">Kunci PIN</h3>
      ${pin?html`<div className="space-y-3"><p className="text-sm text-stone-500">PIN aktif. Aplikasi terkunci saat dibuka dan setelah ditinggalkan lebih dari 1 menit.</p><button className=${sec+' w-full'} onClick=${()=>{if(confirm('Nonaktifkan kunci PIN?')){LS.del('pft_pin');setPin(false)}}}>Nonaktifkan PIN</button></div>`
      :html`<div className="space-y-3"><${Field} label="PIN baru (6 angka)"><input type="password" inputMode="numeric" maxLength="6" className=${inp} value=${p1} onChange=${e=>setP1(e.target.value.replace(/\D/g,''))}/><//>
        <${Field} label="Ulangi PIN"><input type="password" inputMode="numeric" maxLength="6" className=${inp} value=${p2} onChange=${e=>setP2(e.target.value.replace(/\D/g,''))}/><//>
        <button className=${pri} onClick=${savePin}>Aktifkan PIN</button></div>`}

      <div className=${'text-xs mt-1 '+(chg<0?'text-red-600':'text-emerald-700 dark:text-emerald-400')}>${(chg>0?'+':'')+rp(chg)} dari transaksi bulan ini</div></div>
    ${active.length>0&&html`<div className="flex gap-3 overflow-x-auto -mx-4 px-4 pb-1">${active.map(a=>html`<button key=${a.id} onClick=${()=>{setFa(a.id);setTab('tx')}} className=${card+' min-w-[9.5rem] shrink-0 p-3 text-left'}><div className="text-xs text-stone-500 truncate">${a.name}</div><div className=${'font-semibold tabular-nums '+(a.balance<0?'text-red-600':'')}>${rp(a.balance)}</div></button>`)}</div>`}
    <div className=${card+' p-4 space-y-3'}>
      <div className="flex items-center justify-between"><button className="px-2 text-stone-500" aria-label="Bulan sebelumnya" onClick=${()=>setMo(mo-1)}>◀</button>
        <div className="font-semibold">${ym.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</div>
        <button className="px-2 text-stone-500 disabled:opacity-30" aria-label="Bulan berikutnya" disabled=${mo>=0} onClick=${()=>setMo(mo+1)}>▶</button></div>
      <div className="grid grid-cols-2 gap-3"><div><div className="text-xs text-stone-500">Pemasukan</div><div className="font-semibold tabular-nums text-emerald-700 dark:text-emerald-400">${rp(inc)}</div></div>
        <div><div className="text-xs text-stone-500">Pengeluaran</div><div className="font-semibold tabular-nums text-red-600 dark:text-red-400">${rp(exp)}</div></div></div>
      <div className="text-sm text-stone-500">Selisih: <b className=${inc-exp<0?'text-red-600':'text-stone-900 dark:text-stone-100'}>${rp(inc-exp)}</b></div>
      <div className="text-xs text-stone-500">Transfer antar akun tidak dihitung. Hanya biaya admin transfer yang masuk pengeluaran.</div></div>
    ${psum>0&&html`<div className=${card+' p-4'}><div className="font-semibold mb-3">Distribusi saldo</div>
      <div className="flex items-center gap-4"><${Donut} items=${pie} sum=${psum}/>
        <ul className="min-w-0 flex-1 space-y-1.5 text-sm">${pie.map((x,i)=>html`<li key=${x.id} className="flex items-center gap-2"><span className="h-2.5 w-2.5 shrink-0 rounded-full" style=${{background:PAL[i%PAL.length]}}/><span className="truncate flex-1">${x.name}</span><span className="tabular-nums text-stone-500">${Math.round(x.v/psum*100)}%</span></li>`)}</ul></div></div>`}
    ${active.length>0&&html`<div className=${card+' p-4'}><div className="font-semibold mb-2">Perkembangan aset, 30 hari</div><${Line} pts=${series}/>
      <div className="flex justify-between text-xs text-stone-500 tabular-nums"><span>${rp(series[0])}</span><span>${rp(series[29])}</span></div></div>`}
    <div className=${card+' p-4 space-y-3'}><div className="flex items-center justify-between"><div className="font-semibold">Anggaran bulan ini</div><button className="text-sm text-stone-500 underline" onClick=${()=>setModal({k:'bud'})}>${bl.length?'Atur':'Buat anggaran'}</button></div>
      ${bl.length===0?html`<p className="text-sm text-stone-500">Belum ada anggaran. Tetapkan batas per kategori agar pengeluaran terkontrol.</p>`:bl.map(b=>{const r=b.sp/b.amount;return html`<div key=${b.id}><div className="flex justify-between gap-2 text-sm"><span className="truncate">${b.name}</span><span className="tabular-nums text-stone-500 whitespace-nowrap">${rp(b.sp)} / ${rp(b.amount)}</span></div><div className="mt-1 h-1.5 rounded-full bg-stone-200 dark:bg-zinc-800"><div className="h-1.5 rounded-full" style=${{width:Math.min(100,r*100)+'%',background:r>=1?'#dc2626':r>=0.8?'#d97706':'#0f6b4f'}}></div></div><div className=${'text-xs mt-0.5 '+(r>=1?'text-red-600':'text-stone-500')}>${b.amount>=b.sp?'Sisa '+rp(b.amount-b.sp):'Melebihi '+rp(b.sp-b.amount)}</div></div>`})}</div>
    <div className=${card+' p-4 space-y-4'}><div className="flex items-center justify-between"><div className="font-semibold">Target tabungan</div><button className="text-sm text-stone-500 underline" onClick=${()=>setModal({k:'goal',g:null})}>+ Target</button></div>
      ${goals.length===0&&html`<p className="text-sm text-stone-500">Belum ada target. Buat target seperti dana darurat atau liburan.</p>`}
      ${goals.map(g=>{const sv=gl(g.id).reduce((z,c)=>z+c.amount,0),r=Math.max(0,sv)/g.target_amount,rem=g.target_amount-sv;let est='';
        if(g.target_date&&rem>0){const mm=(new Date(g.target_date+'T00:00')-now)/(30.44*864e5);est=mm<=0?'Tenggat sudah lewat':'Perlu sekitar '+rp(Math.ceil(rem/Math.max(1,Math.round(mm))))+' per bulan sampai '+dlabel(g.target_date)}
        return html`<div key=${g.id} className="space-y-1"><div className="flex justify-between gap-2 text-sm"><button className="truncate text-left font-medium" onClick=${()=>setModal({k:'ctb',g})}>${g.name}</button><button className="text-xs text-stone-500 underline" onClick=${()=>setModal({k:'goal',g})}>Edit</button></div>
          <div className="flex justify-between text-xs text-stone-500 tabular-nums"><span>${rp(sv)} / ${rp(g.target_amount)}</span><span>${Math.round(r*100)}%</span></div>
          <div className="h-1.5 rounded-full bg-stone-200 dark:bg-zinc-800"><div className="h-1.5 rounded-full bg-emerald-800" style=${{width:Math.min(100,r*100)+'%'}}></div></div>
          <div className="text-xs text-stone-500">${rem<=0?'Target tercapai':est||'Sisa '+rp(rem)}</div></div>`})}</div>
    <div className="space-y-2"><div className="flex items-center justify-between"><div className="font-semibold">Transaksi terbaru</div><button className="text-sm text-stone-500 underline" onClick=${()=>setTab('tx')}>Lihat semua</button></div>
      ${tx.length===0?html`<div className=${card+' p-5 text-sm text-stone-500'}>Belum ada transaksi. Ketuk tombol + untuk mencatat yang pertama.</div>`:tx.slice(0,5).map(txRow)}</div>
  </div>`;

  // ---- Laporan ----
  const D=(y,m,d)=>new Date(y,m,d),n0=new Date(),fd=(d,o)=>d.toLocaleDateString('id-ID',o);
  let s0,e0,lab,nb;
  if(per==='d'){s0=D(n0.getFullYear(),n0.getMonth(),n0.getDate()+ro);e0=s0;lab=dlabel(iso(s0));nb=1}
  else if(per==='w'){const dw=(n0.getDay()+6)%7;s0=D(n0.getFullYear(),n0.getMonth(),n0.getDate()-dw+ro*7);e0=D(s0.getFullYear(),s0.getMonth(),s0.getDate()+6);lab=fd(s0,{day:'numeric',month:'short'})+' – '+fd(e0,{day:'numeric',month:'short',year:'numeric'});nb=7}
  else if(per==='m'){s0=D(n0.getFullYear(),n0.getMonth()+ro,1);e0=D(s0.getFullYear(),s0.getMonth()+1,0);lab=fd(s0,{month:'long',year:'numeric'});nb=e0.getDate()}
  else{s0=D(n0.getFullYear()+ro,0,1);e0=D(s0.getFullYear(),11,31);lab=String(s0.getFullYear());nb=12}
  const rs=iso(s0),re=iso(e0);
  const bix=ds=>per==='y'?+ds.slice(5,7)-1:per==='d'?0:Math.round((D(+ds.slice(0,4),+ds.slice(5,7)-1,+ds.slice(8,10))-s0)/864e5);
  const bk=Array.from({length:nb},()=>({inc:0,exp:0})),cat={};let rinc=0,rexp=0;
  tx.forEach(t=>{if(t.occurred_on<rs||t.occurred_on>re||(ra&&t.account_id!==ra&&t.to_account_id!==ra))return;const b=bk[bix(t.occurred_on)],x=t.amount;
    if(t.type==='income'){rinc+=x;b.inc+=x}
    else if(t.type==='expense'){rexp+=x;b.exp+=x;const k=names[t.category_id]||'Lainnya';cat[k]=(cat[k]||0)+x}
    else if(t.type==='transfer'&&t.fee>0&&(!ra||t.account_id===ra)){rexp+=t.fee;b.exp+=t.fee;cat['Biaya Admin']=(cat['Biaya Admin']||0)+t.fee}});
  const rset=ra?[ra]:active.map(a=>a.id);
  const effR=t=>{const x=t.amount,h=id=>rset.includes(id);if(t.type==='transfer')return(h(t.account_id)?-(x+t.fee):0)+(h(t.to_account_id)?x:0);if(!h(t.account_id))return 0;return t.type==='expense'?-x:x};
  const cur=ra?(acc.find(a=>a.id===ra)?.balance||0):total;
  const atR=d=>cur-tx.filter(t=>t.occurred_on>d).reduce((z,t)=>z+effR(t),0);
  const td=today();
  const dts=per==='d'?[]:Array.from({length:nb},(_,i)=>per==='y'?iso(D(s0.getFullYear(),i+1,0)):iso(D(s0.getFullYear(),s0.getMonth(),s0.getDate()+i)));
  const apts=[...new Set(dts.map(d=>d>td?td:d))].map(atR);
  const cl=Object.entries(cat).sort((a,b)=>b[1]-a[1]);
  const rep=html`<div className="space-y-4">
    <div className="pt-2"><h1 className="text-2xl font-bold">Laporan</h1></div>
    <div className="grid grid-cols-4 gap-1 rounded-xl bg-stone-200/70 dark:bg-zinc-800 p-1">${[['d','Harian'],['w','Mingguan'],['m','Bulanan'],['y','Tahunan']].map(([k,l])=>html`<button key=${k} onClick=${()=>{setPer(k);setRo(0)}} className=${'rounded-lg py-2 text-xs font-semibold '+(per===k?'bg-white dark:bg-zinc-950 shadow-sm':'text-stone-500')}>${l}</button>`)}</div>
    <div className="flex items-center justify-between"><button className="px-3 py-1 text-stone-500" aria-label="Sebelumnya" onClick=${()=>setRo(ro-1)}>◀</button><div className="text-center font-semibold">${lab}</div><button className="px-3 py-1 text-stone-500 disabled:opacity-30" aria-label="Berikutnya" disabled=${ro>=0} onClick=${()=>setRo(ro+1)}>▶</button></div>
    <select className=${inp} value=${ra} onChange=${e=>setRa(e.target.value)}><option value="">Semua akun</option>${acc.map(a=>html`<option key=${a.id} value=${a.id}>${a.name}</option>`)}</select>
    <div className=${card+' p-4 grid grid-cols-3 gap-2'}>
      <div><div className="text-xs text-stone-500">Pemasukan</div><div className="font-semibold text-sm tabular-nums text-emerald-700 dark:text-emerald-400">${rp(rinc)}</div></div>
      <div><div className="text-xs text-stone-500">Pengeluaran</div><div className="font-semibold text-sm tabular-nums text-red-600 dark:text-red-400">${rp(rexp)}</div></div>
      <div><div className="text-xs text-stone-500">Selisih</div><div className=${'font-semibold text-sm tabular-nums '+(rinc-rexp<0?'text-red-600':'')}>${rp(rinc-rexp)}</div></div></div>
    ${per!=='d'&&html`<div className=${card+' p-4'}><div className="font-semibold mb-2">Pemasukan dan pengeluaran</div><${Bars} b=${bk}/>
      <div className="flex justify-around text-[10px] text-stone-500">${per==='w'?WD.map(x=>html`<span key=${x}>${x}</span>`):per==='y'?MN.map((x,i)=>html`<span key=${i}>${x}</span>`):html`<span>1</span><span>${nb}</span>`}</div>
      <div className="mt-2 flex gap-4 text-xs text-stone-500"><span><span className="inline-block h-2 w-2 rounded-full bg-emerald-800 mr-1"></span>Masuk</span><span><span className="inline-block h-2 w-2 rounded-full bg-orange-700 mr-1"></span>Keluar</span></div></div>`}
    <div className=${card+' p-4 space-y-3'}><div className="font-semibold">Pengeluaran per kategori</div>
      ${cl.length===0?html`<p className="text-sm text-stone-500">Belum ada pengeluaran pada periode ini.</p>`:cl.map(([k,v],i)=>html`<div key=${k}><div className="flex justify-between text-sm"><span className="truncate">${k}</span><span className="tabular-nums text-stone-500">${rp(v)} · ${Math.round(v/rexp*100)}%</span></div><div className="mt-1 h-1.5 rounded-full bg-stone-200 dark:bg-zinc-800"><div className="h-1.5 rounded-full" style=${{width:(v/rexp*100)+'%',background:PAL[i%PAL.length]}}></div></div></div>`)}</div>
    ${apts.length>1&&html`<div className=${card+' p-4'}><div className="font-semibold mb-2">Riwayat total aset${ra?' (akun ini)':''}</div><${Line} pts=${apts}/><div className="flex justify-between text-xs text-stone-500 tabular-nums"><span>${rp(apts[0])}</span><span>${rp(apts[apts.length-1])}</span></div></div>`}
    <button className=${sec+' w-full'} onClick=${()=>{setFa(ra);setD1(rs);setD2(re);setQ('');setTab('tx')}}>Lihat transaksi periode ini</button>
    ${tx.length>=1000&&html`<p className="text-xs text-stone-500">Hanya 1000 transaksi terbaru yang dimuat, jadi periode lama bisa kurang akurat.</p>`}
  </div>`;

  return html`<div className="max-w-md mx-auto min-h-screen px-4 pb-32" style=${{paddingTop:'calc(1rem + env(safe-area-inset-top))'}}>
    ${msg&&html`<div className="fixed top-3 inset-x-4 z-50 mx-auto max-w-md rounded-xl bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900 px-4 py-3 text-sm shadow-lg">${msg}</div>`}
    ${off&&html`<div className="mb-3 rounded-xl bg-amber-100 dark:bg-amber-950 text-amber-900 dark:text-amber-200 px-3 py-2 text-xs">Mode offline: menampilkan data terakhir (hanya baca).</div>`}
    ${ld?html`<p className="py-20 text-center text-stone-500">Memuat…</p>`:tab==='home'?home:tab==='rep'?rep:tab==='acc'?html`<div className="space-y-4">
      <div className="flex items-start justify-between pt-2"><div><div className="text-sm text-stone-500">Total aset</div><div className=${'text-4xl font-bold tracking-tight tabular-nums '+(total<0?'text-red-600':'')}>${rp(total)}</div><div className="text-xs text-stone-500 mt-1">${active.length} akun aktif</div></div>
        <button className="text-sm text-stone-500 underline" onClick=${()=>sb.auth.signOut()}>Keluar</button></div>
      ${active.length===0&&html`<div className=${card+' p-5 text-sm text-stone-500'}>Belum ada akun. Tambahkan akun pertama Anda, mis. Bank Jago, DANA, atau Uang tunai.</div>`}
      <div className="space-y-3">${active.map(accRow)}</div>
      <button className=${sec+' w-full'} onClick=${()=>setModal({k:'acc',a:null})}>+ Tambah akun</button>
      <button className=${sec+' w-full'} onClick=${()=>setModal({k:'data'})}>Ekspor, impor & backup data</button>
      <button className=${sec+' w-full'} onClick=${()=>setModal({k:'set'})}>Pengaturan: tema, PIN, kata sandi</button>
      ${archived.length>0&&html`<details className="text-sm"><summary className="cursor-pointer text-stone-500">Diarsipkan (${archived.length})</summary><div className="mt-3 space-y-3">${archived.map(accRow)}</div></details>`}
    </div>`:html`<div className="space-y-4">
      <div className="pt-2"><h1 className="text-2xl font-bold">Transaksi</h1></div>
      <input type="search" className=${inp} placeholder="Cari catatan, kategori, akun, atau nominal" value=${q} onChange=${e=>setQ(e.target.value)}/>
      <div className="grid grid-cols-2 gap-2"><${Field} label="Dari tanggal"><input type="date" className=${inp} value=${d1} onChange=${e=>setD1(e.target.value)}/><//><${Field} label="Sampai tanggal"><input type="date" className=${inp} value=${d2} onChange=${e=>setD2(e.target.value)}/><//></div>
      ${(q||d1||d2||fa)&&html`<button className="text-sm text-stone-500 underline" onClick=${()=>{setQ('');setD1('');setD2('');setFa('')}}>Hapus semua filter (${list.length} hasil)</button>`}
      <select className=${inp} value=${fa} onChange=${e=>setFa(e.target.value)}><option value="">Semua akun</option>${acc.map(a=>html`<option key=${a.id} value=${a.id}>${a.name}</option>`)}</select>
      ${groups.length===0&&html`<div className=${card+' p-5 text-sm text-stone-500'}>Belum ada transaksi. Ketuk tombol + di bawah untuk mencatat yang pertama.</div>`}
      ${groups.map(g=>html`<div key=${g.d} className="space-y-2"><div className="text-xs font-semibold text-stone-500 pt-2">${dlabel(g.d)}</div>${g.l.map(txRow)}</div>`)}
      ${tx.length>=1000&&html`<p className="text-xs text-stone-500">Menampilkan 1000 transaksi terbaru.</p>`}
    </div>`}
    <nav className="fixed bottom-0 inset-x-0 z-30 border-t border-stone-200 dark:border-zinc-800 bg-stone-50/90 dark:bg-zinc-950/90 backdrop-blur" style=${{paddingBottom:'env(safe-area-inset-bottom)'}}>
      <div className="mx-auto max-w-md flex items-center justify-around py-2">
        <button onClick=${()=>{setFa('');setTab('home')}} className=${'px-3 py-2 text-sm font-semibold '+(tab==='home'?'text-emerald-800 dark:text-emerald-400':'text-stone-500')}>Beranda</button>
        <button onClick=${()=>setTab('acc')} className=${'px-3 py-2 text-sm font-semibold '+(tab==='acc'?'text-emerald-800 dark:text-emerald-400':'text-stone-500')}>Akun</button>
        <button onClick=${()=>openTx(null)} aria-label="Tambah transaksi" className="mx-auto h-14 w-14 -mt-6 rounded-full bg-emerald-800 text-white text-3xl shadow-lg">+</button>
        <button onClick=${()=>setTab('tx')} className=${'py-2 text-sm font-semibold '+(tab==='tx'?'text-emerald-800 dark:text-emerald-400':'text-stone-500')}>Transaksi</button>
        <button onClick=${()=>setTab('rep')} className=${'px-2 py-2 text-sm font-semibold '+(tab==='rep'?'text-emerald-800 dark:text-emerald-400':'text-stone-500')}>Laporan</button>
      </div></nav>
    ${modal&&html`<${Sheet} title=${modal.k==='set'?'Pengaturan':modal.k==='data'?'Data & backup':modal.k==='bud'?'Anggaran bulan ini':modal.k==='goal'?(modal.g?'Edit target':'Target baru'):modal.k==='ctb'?modal.g.name:modal.k==='acc'?(modal.a?'Edit akun':'Akun baru'):modal.k==='adj'?'Sesuaikan saldo':(modal.t?'Detail transaksi':'Transaksi baru')} onClose=${()=>setModal(null)}>
      ${modal.k==='set'?html`<${Settings} flash=${flash}/>`:modal.k==='data'?html`<${DataSheet} acc=${acc} cats=${cats} bud=${bud} goals=${goals} tx=${tx} uid=${uid} names=${names} run=${run} flash=${flash}/>`:modal.k==='bud'?html`<${BudgetForm} cats=${cats} budgets=${bud} bm=${bm} uid=${uid} run=${run} flash=${flash}/>`:modal.k==='goal'?html`<${GoalForm} g=${modal.g} uid=${uid} run=${run} flash=${flash}/>`:modal.k==='ctb'?html`<${Contrib} g=${modal.g} list=${gl(modal.g.id)} uid=${uid} run=${run} flash=${flash}/>`:modal.k==='acc'?html`<${AccForm} a=${modal.a} run=${run} flash=${flash}/>`:modal.k==='adj'?html`<${Adj} a=${modal.a} run=${run}/>`:html`<${TxForm} t=${modal.t} acc=${selectable(modal.t)} cats=${cats} names=${names} run=${run} flash=${flash}/>`}<//>`}
  </div>`;
}

function App(){
  const[s,setS]=useState(undefined),[lk,setLk]=useState(!!LS.get('pft_pin'));
  useEffect(()=>{let h=0;const f=()=>{if(document.hidden)h=Date.now();else if(LS.get('pft_pin')&&h&&Date.now()-h>60000)setLk(true)};document.addEventListener('visibilitychange',f);return()=>document.removeEventListener('visibilitychange',f)},[]);
  useEffect(()=>{sb.auth.getSession().then(({data})=>setS(data.session));
    const{data:l}=sb.auth.onAuthStateChange((_e,x)=>{setS(x);if(!x)LS.del('pft_snap')});return()=>l.subscription.unsubscribe()},[]);
  if(s===undefined)return html`<div className="p-8 text-stone-500">Memuat…</div>`;
  if(s&&lk&&LS.get('pft_pin'))return html`<${Lock} onOk=${()=>setLk(false)} onForgot=${()=>{sb.auth.signOut();LS.del('pft_pin');setLk(false)}}/>`;
  return s?html`<${Main} uid=${s.user.id}/>`:html`<${Login}/>`;
}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
